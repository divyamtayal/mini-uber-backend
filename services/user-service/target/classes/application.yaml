spring:
  application:
    name: user-service           # change per service
  sleuth:
    sampler:
      probability: 1.0   # 100% trace all requests (default 10%)
  zipkin:
    base-url: http://localhost:9411
  eureka:
    client:
      register-with-eureka: true
      fetch-registry: true
      service-url:
        defaultZone: http://localhost:8761/eureka/
    instance:
      prefer-ip-address: true
  datasource:
    url: jdbc:postgresql://localhost:5433/userdb
    username: user
    password: pass
  jpa:
    hibernate:
      ddl-auto: create-drop   # auto creates schema on startup
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: user-service
  tracing:
    sampling:
      probability: 1.0   # trace 100% of requests
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans