server:
  port: 8080

spring:
  application:
    name: api-gateway
  sleuth:
    sampler:
      probability: 1.0   # 100% trace all requests (default 10%)
  zipkin:
    base-url: http://localhost:9411
  cloud:
    discovery:
      enabled: true
    gateway:
      default-filters: # (optional) add response headers for debugging
        - RemoveRequestHeader=Cookie
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      # Optional: auto-create routes from serviceId (if you like /SERVICE-ID/** style)
      discovery:
        locator:
          enabled: false   # keep false since you're defining routes manually
      httpclient:
        # sensible timeouts
        connect-timeout: 3000
        response-timeout: 5s
        pool:
          type: ELASTIC
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/users

        - id: driver-service
          uri: lb://driver-service
          predicates:
            - Path=/api/drivers/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: driverServiceCB
                fallbackUri: forward:/fallback/drivers

        - id: ride-service
          uri: lb://ride-service
          predicates:
            - Path=/api/rides/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: rideServiceCB
                fallbackUri: forward:/fallback/rides

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: paymentServiceCB
                fallbackUri: forward:/fallback/payments

        - id: tracking-service
          uri: lb://tracking-service
          predicates:
            - Path=/api/tracking/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: trackingServiceCB
                fallbackUri: forward:/fallback/tracking

        - id: matching-service
          uri: lb://matching-service
          predicates:
            - Path=/api/matching/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: matchingServiceCB
                fallbackUri: forward:/fallback/matching

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: notificationServiceCB
                fallbackUri: forward:/fallback/notifications

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: 1.0   # trace 100% of requests
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: api-gateway
security:
  jwt:
    secret: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: WARN
resilience4j:
  circuitbreaker:
    instances:
      userService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
  timelimiter:
    instances:
      userService:
        timeoutDuration: 3s
