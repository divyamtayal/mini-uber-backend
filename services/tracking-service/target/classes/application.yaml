spring:
  application:
    name: tracking-service           # change per service
  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
      register-with-eureka: true
      fetch-registry: true
  sleuth:
    sampler:
      probability: 1.0   # 100% trace all requests (default 10%)
  zipkin:
    base-url: http://localhost:9411
  redis:
    host: localhost
    port: 6379

server:
  port: 8085
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: tracking-service
  tracing:
    sampling:
      probability: 1.0   # trace 100% of requests
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans